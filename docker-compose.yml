services:
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    command:
      - python
      - server.py
      - --host
      - 0.0.0.0
      - --project
      - ${SIMULATOR_PROJECT:-aquasense}
    ports:
      - "8765:8765"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8765}
    depends_on:
      - simulator
    ports:
      - "5173:80"
